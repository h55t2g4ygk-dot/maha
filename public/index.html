<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MAHA AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F5EDD8;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #1B3A2D;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .logo {
      width: 40px; height: 40px;
      background: #C8841A;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .header-text h1 { font-family: Georgia, serif; font-size: 18px; color: #F5EDD8; font-weight: 700; }
    .header-text p { font-size: 10px; color: #8FB49A; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      animation: popIn 0.2s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      background: #1B3A2D;
      color: #F5EDD8;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      background: #FFF8EC;
      color: #2A2218;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #E0D0B0;
    }
    .dots span {
      display: inline-block;
      animation: bounce 1.2s infinite;
      font-size: 18px;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 12px;
      flex-shrink: 0;
    }
    .suggestion-btn {
      background: #FFF8EC;
      border: 1px solid #C8B896;
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 13px;
      color: #4A3E2D;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestion-btn:active { background: #EEE0C0; }
    .input-area {
      background: #FFF8EC;
      border-top: 1px solid #DDD0B4;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1.5px solid #C8B896;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      font-family: system-ui;
      color: #2A2218;
      background: #FFFDF7;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.4;
      -webkit-appearance: none;
    }
    #input:focus { border-color: #1B3A2D; }
    #send {
      width: 42px; height: 42px;
      background: #1B3A2D;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      color: white;
    }
    #send:disabled { background: #8FB49A; cursor: not-allowed; }
    .welcome { text-align: center; padding: 20px; color: #7A6B55; }
    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-family: Georgia, serif; font-size: 20px; color: #1B3A2D; margin-bottom: 8px; }
    .welcome p { font-size: 14px; line-height: 1.6; }
    .disclaimer { text-align: center; font-size: 11px; color: #9A8B72; padding: 6px 16px 2px; flex-shrink: 0; }
  </style>
</head>
<body>
<header>
  <div class="logo">🌿</div>
  <div class="header-text">
    <h1>MAHA AI Assistant</h1>
    <p>Make America Healthy Again</p>
  </div>
</header>

<div id="messages">
  <div class="welcome">
    <div class="icon">🌿</div>
    <h2>Welcome to MAHA AI Assistant</h2>
    <p>Ask me anything about healthy eating, seed oils, food ingredients, or paste a recipe for MAHA-compliant advice.</p>
  </div>
</div>

<div class="suggestions" id="suggestions">
  <button class="suggestion-btn" onclick="send('Are seed oils really that bad?')">Are seed oils bad?</button>
  <button class="suggestion-btn" onclick="send('What cooking oils should I use?')">Best cooking oils?</button>
  <button class="suggestion-btn" onclick="send('Is this MAHA compliant? Pasta with olive oil, garlic, organic tomatoes, and grass-fed beef.')">Rate my recipe</button>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask about food, recipes, ingredients…" rows="1"
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
  <button id="send" onclick="sendMessage()">➤</button>
</div>

<p class="disclaimer">Educational only — not medical advice.</p>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const suggestionsEl = document.getElementById('suggestions');
  let history = [];
  let thinking = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showThinking() {
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'thinking';
    div.innerHTML = '<span class="dots"><span>·</span><span>·</span><span>·</span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking');
    if (el) el.remove();
  }

  function send(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || thinking) return;
    suggestionsEl.style.display = 'none';
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();
    inputEl.value = '';
    inputEl.style.height = 'auto';
    thinking = true;
    sendBtn.disabled = true;
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    showThinking();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      removeThinking();
      if (data.error) throw new Error(data.error);
      const reply = data.content?.find(b => b.type === 'text')?.text || 'Sorry, no response received.';
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeThinking();
      addMessage('assistant', 'Sorry, something went wrong. Please try again.');
      history.pop();
    }
    thinking = false;
    sendBtn.disabled = false;
  }
</script>
</body>
</html>
